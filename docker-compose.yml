# Family Hub — docker compose file.
# Works with the Unraid "Docker Compose Manager" plugin or plain `docker compose up -d`.
# Copy .env.example to .env (same folder) and fill in your keys first.

services:
  family-hub:
    build: .
    image: family-hub:latest
    container_name: family-hub
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/London}
      - DATA_DIR=/data
    volumes:
      # On Unraid keep this under appdata so it's included in backups.
      - ${DATA_PATH:-/mnt/user/appdata/family-hub}:/data
